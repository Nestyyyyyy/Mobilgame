<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1418">
<title>Sınıfın Kralı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1b1418; color: #f2e6c9; overflow: hidden; touch-action: none;
    font-family: "Press Start 2P", "Courier New", monospace; user-select: none; -webkit-user-select: none;
  }
  #g { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    background: #1b1418; border-top: 3px solid #ffcf3f; box-shadow: inset 0 3px 0 #6e0f1e;
    display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden;
    touch-action: pan-x; scrollbar-width: none;
  }
  #bar::-webkit-scrollbar { display: none; }
  #bar button {
    flex: 0 0 auto; width: 66px; height: 70px; border: 2px solid #3a2a2e; border-radius: 3px;
    background: #2a1e22; color: #d9c9a0; cursor: pointer; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    font: 7px/1 "Press Start 2P", "Courier New", monospace; touch-action: pan-x;
  }
  #bar button img { width: 36px; height: 36px; image-rendering: pixelated; }
  #bar button:focus-visible { outline: 2px solid #ffcf3f; outline-offset: 2px; }
  #bar button.sel { background: #ffcf3f; color: #1b1418; border-color: #fff2b0; box-shadow: 0 0 0 2px #6e0f1e; }
  #bar button.peace { background: #1f4a33; color: #bfe8c9; border-color: #3f8a5a; }
  #tip {
    position: fixed; bottom: 100px; left: 0; right: 0; text-align: center;
    color: #fff2b0; font-size: 8px; line-height: 1.6; pointer-events: none; opacity: .95; transition: opacity 1s;
    text-shadow: 1px 1px 0 #1b1418, -1px -1px 0 #1b1418, 1px -1px 0 #1b1418, -1px 1px 0 #1b1418;
  }
  #tip.hide { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #tip { transition: none; } }
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="tip">Alttan eşya seç, kafasına dokun!</div>
<div id="bar"></div>
<script>
(() => {
'use strict';

// ---------- Palet ----------
const C = {

// ---------- Kafa sprite (24x26) ----------
// o=çizgi H=saç h=saç ışığı d=saç gölgesi S=ten s=ten gölgesi
const HEAD = [

  '.oHHHHHHHdSSSSSSSSSdHHo.',
  '.oHHHHHdSSSSSSSSSSSSHHo.',
  '.oHHHdSSSSSSSSSSSSSSoHo.',
  'ooHHoSSSSSSSSSSSSSSSoHoo',

  '..osSSSSSSSSSSSSSSSSso..',

  '...osSSSSSSSSSSSSSSso...',
  '....oSSSSSSSSSSSSSSo....',
  '.....osSSSSSSSSSSso.....',
  '......ooSSSSSSSSoo......',
  '........ooSSSSoo........',

const HEAD_MAP = { o: C.out, H: C.hair, h: C.hairL, d: C.hairD, S: C.skin, s: C.skinD };
const HW = 24, HH = 26; // sprite boyutu

// ---------- Eşya sprite'ları ----------
const SPR = {
  slap: { map: { o: C.out, S: C.skin, D: C.skinD, L: C.skinL }, rows: [
    '..o.o.o.....', '.oSoSoSo.o..', '.oSoSoSoSo..', '.oSSSSSSSo..', '.oSSSSSSSSo.', 'oSSLSSSSSSSo',
    'oSSSSSSSSSSo', '.oSSSSSSSSo.', '.oSSSSSSSo..', '..oSSSSSSo..', '..oDSSSSDo..', '...oooooo...' ] },
  glove: { map: { o: C.out, R: C.glove, D: C.gloveD, W: C.gloveW, L: C.gloveL }, rows: [
    '....oooo....', '..ooRRRRoo..', '.oRRLRRRRRo.', 'oRRLRRRRRRRo', 'oRRRRRRRRRRo', 'oRRRRRRRRRDo',
    'oRRRRRRRRRDo', '.oRRRRRRRDo.', '..oRRRRRDo..', '..oWWWWWWo..', '..oWWWWWWo..', '..oooooooo..' ] },
  book: { map: { o: C.out, R: C.book, W: C.bookW, G: C.bookG, D: C.bookD }, rows: [
    'oooooooooo..', 'oRRRRRRRRoW.', 'oRRGGGGRRoW.', 'oRRRRRRRRoW.', 'oRWWWWWWRoW.', 'oRWWWWWWRoW.',
    'oRRRRRRRRoW.', 'oRRGGGGRRoW.', 'oRRRRRRRRoW.', 'oDDDDDDDDoW.', 'oooooooooo..', '............' ] },
  slipper: { map: { o: C.out, B: C.slip, D: C.slipD, L: C.slipL, T: C.sole }, rows: [
    '............', '............', '....oooo....', '...oLLLLo...', '..oLLLLLLo..', '.oLLooooLLo.',
    'oBBBBBBBBBBo', 'oBBLLLLLLBBo', 'oBBBBBBBBBBo', 'oTTTTTTTTTTo', 'oDDDDDDDDDDo', '.oooooooooo.' ] },
  tomato: { map: { o: C.out, R: C.tom, D: C.tomD, L: C.tomL, G: C.leaf }, rows: [
    '...oGo..', '..oGGGo.', '.oRLRRRo', 'oRLRRRRo', 'oRRRRRRo', 'oRRRRRDo', '.oRRRDo.', '..oooo..' ] },
  pillow: { map: { o: C.out, P: C.pil, D: C.pilD, L: C.pilL }, rows: [
    '............', 'oooooooooooo', 'oPLLLLLLLLPo', 'oLPPPPPPPPLo', 'oPPPPPPPPPPo', 'oPPPPPPPPPPo',
    'oPPPPPPPPPDo', 'oPDDDDDDDDDo', 'oooooooooooo', '............', '............', '............' ] },
  feather: { map: { o: C.out, F: C.fea, D: C.feaD }, rows: [
    '..........oo', '.........oFo', '........oFFo', '.......oFFFo', '......oFFFo.', '.....oFFFo..',
    '....oFFFo...', '...oFDFo....', '..oFDFo.....', '.oDDo.......', 'oDo.........', 'o...........' ] },
  snow: { map: { o: C.out, W: C.snow, D: C.snowD }, rows: [
    '..oooo..', '.oWWWWo.', 'oWWWWWWo', 'oWWWWWDo', 'oWWWWDDo', 'oDWWDDDo', '.oDDDDo.', '..oooo..' ] },
  fist: { map: { o: C.out, S: C.skin, D: C.skinD, L: C.skinL }, rows: [
    '.oooooo.', 'oSSSSSSo', 'oSoSoSSo', 'oSSSSSSo', 'oLSSSSSo', 'oDSSSSDo', '.oSSSSo.', '..oooo..' ] },
  thumb: { map: { o: C.out, S: C.skin, D: C.skinD, L: C.skinL }, rows: [
    '...oo...', '..oSSo..', '..oLSo..', 'ooSSSSoo', 'oSSSSSSo', 'oSSSSSSo', 'oDSSSSDo', '.oooooo.' ] },
  peace: { map: { o: C.out, S: C.skin, D: C.skinD, L: C.skinL, R: C.red }, rows: [
    '..oo....oo..', '.oSSo..oSSo.', '.oSSoooSSSo.', 'oSSSSSSSSSSo', 'oSSSSSSSSSSo', '.oSSSSSSSSo.',
    '..oSSSSSSo..', '..oDSSSSDo..', '..oRRRRRRo..', '..oRRRRRRo..', '..oooooooo..', '............' ] },
};

const ITEMS = [
  { id: 'slap',    name: 'TOKAT',   kind: 'swing', power: 1.0, face: 'ouch',   sfx: 'slap',   words: ['ŞAK!', 'ÇAT!'], lines: ['Ay!', 'Yapma ya!', 'Elin ağırmış!', 'Hocam görüyor musun?'] },
  { id: 'glove',   name: 'ELDİVEN', kind: 'swing', power: 1.8, face: 'dizzy',  sfx: 'thud',   words: ['POW!', 'BAM!'], lines: ['Off!', 'Yıldızları gördüm!', 'Ring mi burası?'], stars: true },
  { id: 'book',    name: 'KİTAP',   kind: 'swing', power: 1.3, face: 'ouch',   sfx: 'slap',   words: ['PAT!', 'GÜM!'], lines: ['Kitapla mı?', 'Okusana onu!', 'Sınav var ya!'] },
  { id: 'slipper', name: 'TERLİK',  kind: 'swing', power: 1.4, face: 'ouch',   sfx: 'slap',   words: ['ŞLAP!'],        lines: ['Anne terliği!', 'Yok artık!', 'Terlik mi ya?'] },
  { id: 'tomato',  name: 'DOMATES', kind: 'throw', power: 0.6, face: 'grumpy', sfx: 'splat',  words: ['SPLAT!'],       lines: ['Domates mi?!', 'Iyy!', 'Salata oldum!'], splat: 'tomato' },
  { id: 'pillow',  name: 'YASTIK',  kind: 'swing', power: 0.7, face: 'sleepy', sfx: 'puf',    words: ['PUF!'],         lines: ['Puf!', 'Uykum geldi...', 'Yumuşakmış'], feathers: true },
  { id: 'feather', name: 'TÜY',     kind: 'swing', power: 0.1, face: 'laugh',  sfx: 'giggle', words: ['HİHİ!'],        lines: ['Hihi dur!', 'Gıdıklanıyorum!', 'Hahaha!'] },
  { id: 'snow',    name: 'KARTOPU', kind: 'throw', power: 0.9, face: 'cold',   sfx: 'crunch', words: ['ÇAT!'],         lines: ['Brr!', 'Soğuk soğuk!', 'Kışın mı geldik?'], splat: 'snow' },
  { id: 'peace',   name: 'BARIŞ',   kind: 'peace', lines: ['Tamam, barıştık!', 'Süper, dostuz!', 'Helal olsun!'] },
];
const MISS_LINES = ['Iska!', 'Tutturamadın!', 'Buradayım!'];

// ---------- Canvas ----------
const cv = document.getElementById('g');
const sc = cv.getContext('2d');
const off = document.createElement('canvas');
const g = off.getContext('2d');
const hc = document.createElement('canvas');
const hg = hc.getContext('2d');
let cg = g; // aktif çizim bağlamı
const bar = document.getElementById('bar');
const tipEl = document.getElementById('tip');
let W = 0, H = 0, S = 3, K = 3, HX = 0, HT = 0; // K: kafa ölçeği, HX: kafa merkezi x, HT: kafa üst y

function resize() {
  const dw = window.innerWidth, dh = window.innerHeight;
  const bh = bar.getBoundingClientRect().height;
  const ph = dh - bh;
  tipEl.style.bottom = (bh + 8) + 'px';
  S = Math.max(2, Math.floor(Math.min(dw, ph) / 120));
  W = Math.ceil(dw / S); H = Math.ceil(ph / S);
  off.width = W; off.height = H;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(W * S * dpr); cv.height = Math.round(H * S * dpr);
  cv.style.width = (W * S) + 'px'; cv.style.height = (H * S) + 'px';
  sc.imageSmoothingEnabled = false;
  K = Math.max(2, Math.min(6, Math.floor(Math.min(W * 0.62, H * 0.52) / HW)));
  HX = Math.floor(W / 2); HT = Math.floor(H * 0.5 - HH * K / 2);
}

// ---------- Ses ----------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type, vol) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), a.currentTime + dur);
  gn.gain.setValueAtTime(vol || 0.08, a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(gn); gn.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, cutoff, vol, hp) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = a.createBufferSource(), gn = a.createGain(), f = a.createBiquadFilter();
  f.type = hp ? 'highpass' : 'lowpass'; f.frequency.value = cutoff;
  src.buffer = buf; gn.gain.value = vol;
  src.connect(f); f.connect(gn); gn.connect(a.destination); src.start();
}
const SFX = {
  slap:   () => { noise(0.08, 1800, 0.35, true); tone(500, 150, 0.06, 'square', 0.04); },
  thud:   () => { noise(0.14, 500, 0.3); tone(120, 40, 0.16, 'triangle', 0.14); },
  splat:  () => { noise(0.18, 900, 0.25); tone(300, 60, 0.2, 'sawtooth', 0.05); },
  puf:    () => { noise(0.2, 400, 0.18); },
  giggle: () => { tone(700, 900, 0.06, 'triangle', 0.05); setTimeout(() => tone(800, 1000, 0.06, 'triangle', 0.05), 90); setTimeout(() => tone(900, 1100, 0.06, 'triangle', 0.05), 180); },
  crunch: () => { noise(0.1, 3000, 0.25, true); tone(400, 200, 0.05, 'square', 0.03); },
  swish:  () => { noise(0.12, 2500, 0.1, true); },
  peace:  () => { tone(500, 750, 0.12, 'triangle', 0.06); setTimeout(() => tone(750, 1000, 0.18, 'triangle', 0.06), 120); },
};

// ---------- Durum ----------
const head = { a: 0, va: 0, ox: 0, vx: 0, oy: 0, sq: 0, face: 'happy', faceT: 0, side: 0, markT: 0, blink: 0, eyeX: 0, eyeY: 0 };
let sel = 0;
const strikes = [], fx = [], parts = [], splats = [];
let bubble = '', bubbleT = 0;
let hits = 0, combo = 0, comboT = 0, best = 0, recent = 0, recentT = 0, angryT = 0, hitPop = 0;
let ptr = { x: 0, y: 0 };
let thumbT = 0, t = 0;
try { best = +localStorage.getItem('sk_best_combo') || 0; } catch (e) {}

function say(s, f) { bubble = s; bubbleT = f || 70; }
const pick = arr => arr[(Math.random() * arr.length) | 0];

// ---------- Eşya çubuğu (ikonlar sprite'lardan üretilir) ----------
function iconURL(id) {
  const s = SPR[id], k = 4, n = s.rows.length;
  const c = document.createElement('canvas'); c.width = 12 * k; c.height = 12 * k;
  const x = c.getContext('2d');
  const o = Math.floor((12 - n) / 2) * k;
  for (let j = 0; j < n; j++) for (let i = 0; i < s.rows[j].length; i++) {
    const col = s.map[s.rows[j][i]]; if (col) { x.fillStyle = col; x.fillRect(o + i * k, o + j * k, k, k); }
  }
  return c.toDataURL();
}
ITEMS.forEach((it, i) => {
  const b = document.createElement('button');
  const img = document.createElement('img'); img.src = iconURL(it.id); img.alt = '';
  const lb = document.createElement('span'); lb.textContent = it.name;
  b.appendChild(img); b.appendChild(lb);
  b.id = 'item-' + it.id;
  if (it.kind === 'peace') b.classList.add('peace');
  b.addEventListener('pointerup', e => { e.preventDefault(); audio(); select(i); });
  b.addEventListener('contextmenu', e => e.preventDefault());
  bar.appendChild(b);
});
function select(i) {
  const it = ITEMS[i];
  if (it.kind === 'peace') { makePeace(); return; }
  sel = i;
  [...bar.children].forEach((b, j) => b.classList.toggle('sel', j === i));
  tone(400, 600, 0.05, 'square', 0.03);
}
select(0);

// ---------- Giriş ----------
function toWorld(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toWorld(e); ptr.x = p.x; ptr.y = p.y;
  strike(p.x, p.y);
});
cv.addEventListener('pointermove', e => { const p = toWorld(e); ptr.x = p.x; ptr.y = p.y; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= ITEMS.length) select(n - 1);
  if (e.key === ' ') strike(HX + (Math.random() < 0.5 ? -1 : 1) * K * 5, HT + 14 * K);
});

// ---------- Vuruş ----------
function strike(x, y) {
  const it = ITEMS[sel];
  const dir = x < HX ? 1 : -1; // soldan vurulursa kafa sağa gider
  if (it.kind === 'throw') {
    const ax = dir > 0 ? W * 0.18 : W * 0.82;
    strikes.push({ it, x, y, dir, t: 0, dur: 22, wind: 7, ax, ay: H + 10 * K, sx: ax, sy: H - 5 * K });
  } else {
    const ax = dir > 0 ? -6 * K : W + 6 * K, ay = H + 8 * K;
    const sx = ax + (x - ax) * 0.45, sy = ay + (y - ay) * 0.45;
    strikes.push({ it, x, y, dir, t: 0, dur: 11, hitAt: 4, ax, ay, sx, sy });
  }
}
function onHead(x, y) {
  const cx = HX + head.ox, cy = HT + 13 * K + head.oy;
  const dx = (x - cx) / (11.5 * K), dy = (y - cy) / (13 * K);
  return dx * dx + dy * dy <= 1;
}
function impact(s) {
  const it = s.it;
  if (!onHead(s.x, s.y)) {
    SFX.swish();
    fx.push({ s: 'ISKA', x: s.x, y: s.y - 6, vy: -0.4, life: 30, c: C.hud, k: 1 });
    if (Math.random() < 0.4) say(pick(MISS_LINES), 50);
    combo = 0;
    return;
  }
  const p = it.power;
  head.va += s.dir * 0.07 * p;
  head.vx += s.dir * 2.4 * p;
  head.sq = Math.max(head.sq, Math.min(0.2, 0.07 + 0.07 * p));
  head.face = it.face; head.faceT = it.face === 'laugh' ? 60 : 55 + 25 * p;
  head.side = -s.dir; head.markT = it.id === 'slap' ? 90 : 0;
  hits++; hitPop = 10; combo = comboT > 0 ? combo + 1 : 1; comboT = 60;
  if (combo > best) { best = combo; try { localStorage.setItem('sk_best_combo', best); } catch (e) {} }
  recent++; recentT = 240;
  (SFX[it.sfx] || SFX.slap)();
  fx.push({ s: pick(it.words), x: s.x + s.dir * 4, y: s.y - 10, vy: -0.6, life: 32, c: C.gold, k: 2 });
  if (combo > 1) fx.push({ s: 'X' + combo, x: s.x, y: s.y + 4, vy: -0.3, life: 40, c: C.white, k: 1 });
  if (it.stars) for (let i = 0; i < 6; i++) parts.push({ kind: 'star', ang: i * Math.PI / 3, r: K * 12, life: 90, spin: 0.08 });
  if (it.feathers) for (let i = 0; i < 8; i++) parts.push({ kind: 'feather', x: s.x, y: s.y, vx: (Math.random() - 0.5) * 1.5, vy: -Math.random() * 1.2, life: 60 + Math.random() * 40 });
  if (it.id === 'snow') for (let i = 0; i < 10; i++) parts.push({ kind: 'snow', x: s.x, y: s.y, vx: (Math.random() - 0.5) * 2, vy: -Math.random() * 1.5, life: 40 + Math.random() * 20 });
  if (it.id === 'slap' || it.id === 'slipper' || it.id === 'book') for (let i = 0; i < 5; i++) parts.push({ kind: 'spark', x: s.x, y: s.y, vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.7) * 2, life: 14 });
  if (it.splat) {
    splats.push({ kind: it.splat, lx: (s.x - (HX + head.ox)) / K, ly: (s.y - (HT + 13 * K + head.oy)) / K, life: 240 });
    if (splats.length > 5) splats.shift();
  }
  if (recent >= 12 && angryT === 0) { angryT = 200; head.face = 'angry'; head.faceT = 200; say('Yeter artık ya!', 90); tone(200, 120, 0.3, 'sawtooth', 0.06); }
  else if (Math.random() < 0.5 || combo === 1) say(pick(it.lines), 55);
}
function makePeace() {
  const it = ITEMS[ITEMS.length - 1];

function px(x, y, w, h, c) { cg.fillStyle = c; cg.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function grid(rows, map, x, y, k) {
  k = k || 1;
  for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) {
    const c = map[rows[j][i]]; if (c) px(x + i * k, y + j * k, k, k, c);
  }
}
const FONT = {
  A:'010|101|111|101|101', B:'110|101|110|101|110', C:'011|100|100|100|011', D:'110|101|101|101|110',
  E:'111|100|110|100|111', F:'111|100|110|100|100', G:'011|100|101|101|011', H:'101|101|111|101|101',
  I:'111|010|010|010|111', J:'001|001|001|101|010', K:'101|101|110|101|101', L:'100|100|100|100|111',
  M:'101|111|111|101|101', N:'110|101|101|101|101', O:'010|101|101|101|010', P:'110|101|110|100|100',
  Q:'010|101|101|111|011', R:'110|101|110|101|101', S:'011|100|010|001|110', T:'111|010|010|010|010',
  U:'101|101|101|101|111', V:'101|101|101|101|010', W:'101|101|111|111|101', X:'101|101|010|101|101',
  Y:'101|101|010|010|010', Z:'111|001|010|100|111',
  0:'111|101|101|101|111', 1:'010|110|010|010|111', 2:'111|001|111|100|111', 3:'111|001|111|001|111',
  4:'101|101|111|001|001', 5:'111|100|111|001|111', 6:'111|100|111|101|111', 7:'111|001|010|010|010',
  8:'111|101|111|101|111', 9:'111|101|111|001|111',
  '!':'010|010|010|000|010', '+':'000|010|111|010|000', '.':'000|000|000|000|010', ':':'000|010|000|010|000',
  '-':'000|000|111|000|000', '?':'111|001|011|000|010', "'":'010|010|000|000|000', ',':'000|000|000|010|100',
  ' ':'000|000|000|000|000',
};
const TR = { 'İ':'I','Ş':'S','Ğ':'G','Ü':'U','Ö':'O','Ç':'C' };
function norm(s) { return String(s).toLocaleUpperCase('tr').replace(/[İŞĞÜÖÇ]/g, ch => TR[ch]); }
function textW(s, k) { k = k || 1; return norm(s).length * 4 * k - k; }
function text(s, x, y, c, k, align, noShadow) {
  k = k || 1; s = norm(s);
  const w = textW(s, k);
  let cx = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? x - w : x;
  for (const ch of s) {
    const gl = FONT[ch];
    if (gl) {
      const rows = gl.split('|');
      if (!noShadow) for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (rows[j][i] === '1') px(cx + i * k + k, y + j * k + k, k, k, C.out);
      for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (rows[j][i] === '1') px(cx + i * k, y + j * k, k, k, c);
    }
    cx += 4 * k;
  }
}
const ICONS = {

// ---------- Kafa ----------
function drawHead() {
  const hd = head;
  const shiver = hd.face === 'cold' ? ((t >> 1) & 1 ? 1 : -1) : 0;
  const wob = hd.face === 'laugh' ? Math.sin(t * 0.6) * 0.05 : 0;
  if (hc.width !== HW * K) { hc.width = HW * K; hc.height = HH * K; }
  hg.clearRect(0, 0, hc.width, hc.height);
  cg = hg;
  grid(HEAD, HEAD_MAP, 0, 0, K);
  drawFace();
  for (const sp of splats) {
    const x = 12 * K + sp.lx * K, y = 13 * K + sp.ly * K;
    hg.globalAlpha = Math.min(1, sp.life / 40);
    if (sp.kind === 'tomato') {
      px(x - 3 * K, y - 1.5 * K, 6 * K, 3 * K, C.tomD); px(x - 2 * K, y - 3 * K, 4 * K, 6 * K, C.tomD);
      px(x - 1.5 * K, y - 1.5 * K, 3 * K, 2 * K, C.tom); px(x + 2.5 * K, y + 2 * K, K, K, C.tomD); px(x - 3.5 * K, y + 0.5 * K, K, K, C.tomD);
      px(x - 0.5 * K, y + 3.5 * K + Math.min(4, (240 - sp.life) / 25) * K, K, 2 * K, C.tomD);
      px(x + 1 * K, y + 3 * K + Math.min(3, (240 - sp.life) / 40) * K, 0.6 * K, 1.5 * K, C.tomD);
    } else {
      px(x - 3 * K, y - 1.5 * K, 6 * K, 3 * K, C.snowD); px(x - 2 * K, y - 2.5 * K, 4 * K, 3 * K, C.snow);
      px(x + 2.5 * K, y + 1.5 * K, K, K, C.snow); px(x - 3.5 * K, y + 0.5 * K, K, K, C.snow);
    }
    hg.globalAlpha = 1;
  }
  cg = g;
  g.save();
  g.translate(HX + hd.ox + shiver, HT + HH * K + hd.oy); // boyun pivotu (çene altı orta)
  g.rotate(hd.a + wob);
  g.scale(1 + hd.sq, 1 - hd.sq);
  g.imageSmoothingEnabled = false;
  g.drawImage(hc, -12 * K, -HH * K);
  g.restore();
}

function drawFace() {

    else { eyeSmile(LX, EY); eyeSmile(RX, EY); }
  } else if (face === 'ouch') {
    f(LX, EY, 1, 1, C.eye); f(LX + 1, EY + 1, 1, 1, C.eye); f(LX + 2, EY + 2, 1, 1, C.eye); f(LX + 1, EY + 1, 1, 1, C.eye); f(LX + 2, EY, 1, 1, C.eye); f(LX, EY + 2, 1, 1, C.eye);
    f(RX + 1, EY, 1, 1, C.eye); f(RX + 2, EY + 1, 1, 1, C.eye); f(RX + 3, EY + 2, 1, 1, C.eye); f(RX + 3, EY, 1, 1, C.eye); f(RX + 1, EY + 2, 1, 1, C.eye);
  } else if (face === 'dizzy') {
    const sp = (t >> 2) & 1;
    f(LX, EY - 0.5, 4, 4, C.eye); f(LX + 1, EY + 0.5, 2, 2, sp ? C.eyeW : C.skin); f(LX + (sp ? 3 : 0), EY - 0.5, 1, 1, C.skin);
    f(RX, EY - 0.5, 4, 4, C.eye); f(RX + 1, EY + 0.5, 2, 2, sp ? C.skin : C.eyeW); f(RX + (sp ? 0 : 3), EY + 2.5, 1, 1, C.skin);
  } else if (face === 'sleepy') {
    f(LX, EY + 1, 4, 0.8, C.eye); f(RX, EY + 1, 4, 0.8, C.eye); f(LX + 1, EY + 2, 1, 0.6, C.eye); f(RX + 2, EY + 2, 1, 0.6, C.eye);
  } else if (face === 'grumpy' || face === 'angry') {
    eyeOpen(LX, EY, ex * 0.5, 0.3, false); eyeOpen(RX, EY, ex * 0.5, 0.3, false);
    f(LX, EY - 0.2, 4, 1.2, C.skin); f(RX, EY - 0.2, 4, 1.2, C.skin); f(LX, EY + 0.8, 4, 0.6, C.lash); f(RX, EY + 0.8, 4, 0.6, C.lash);
  } else if (face === 'cold') {

  // tokat izi (üç parmak)
  if (hd.markT > 0) { const mx = hd.side < 0 ? 3 : 15; f(mx, 14, 1.2, 5, C.mark); f(mx + 1.8, 13.5, 1.2, 6, C.mark); f(mx + 3.6, 14, 1.2, 5, C.mark); f(mx + 5.2, 15, 1, 3, C.mark); }
  // ağız
  if (face === 'happy') { f(6.5, 19.5, 1, 1, C.skinD); f(16.5, 19.5, 1, 1, C.skinD); f(7, 20, 1, 1, C.mouth); f(16, 20, 1, 1, C.mouth); f(8, 21, 8, 1, C.mouth); f(9, 22, 6, 0.7, C.lip); }

}

// ---------- Eşyalar, kol ve el ----------
function drawSprite(id, x, y, rot, k, flip) {
  const s = SPR[id]; if (!s) return;
  const n = s.rows.length;
  g.save(); g.translate(x, y); g.rotate(rot || 0); if (flip) g.scale(-1, 1);
  grid(s.rows, s.map, -n / 2 * k, -n / 2 * k, k);
  g.restore();
}
// kol: (ax,ay) ekran dışı omuz noktasından (hx,hy) bileğe
function drawArm(ax, ay, hx, hy, k) {
  const dx = hx - ax, dy = hy - ay, len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx);
  g.save(); g.translate(ax, ay); g.rotate(ang);
  px(-k, -3.5 * k, len + k, 7 * k, C.out);
  px(0, -3 * k, len * 0.5, 6 * k, C.sleeve);       // kazak kolu
  px(0, -3 * k, len * 0.5, 1 * k, C.sleeveL);
  px(0, 2 * k, len * 0.5, 1 * k, C.sleeveD);
  px(len * 0.5 - 1.5 * k, -3.5 * k, 2 * k, 7 * k, C.sleeveD); // manşet
  px(len * 0.5 + 0.5 * k, -2.5 * k, len * 0.5, 5 * k, C.skin);   // önkol
  px(len * 0.5 + 0.5 * k, 1.5 * k, len * 0.5, 1 * k, C.skinD);
  px(len * 0.5 + 0.5 * k, -2.5 * k, len * 0.5, 0.8 * k, C.skinL);
  g.restore();
  return ang;
}
function drawHeld(it, hx, hy, ang, dir, k) {
  const ux = Math.cos(ang), uy = Math.sin(ang); // kol yönü
  const rot = ang + Math.PI / 2, flip = dir < 0;
  if (it.id === 'slap') { drawSprite('slap', hx + ux * 5 * k, hy + uy * 5 * k, rot, k, flip); return; }
  drawSprite(it.id, hx + ux * 6.5 * k, hy + uy * 6.5 * k, rot, k, flip);
  drawSprite('fist', hx + ux * 1.5 * k, hy + uy * 1.5 * k, rot, k, flip);
}
function drawStrikes() {
  const k = Math.max(2, K - 1);
  for (const s of strikes) {
    const it = s.it;
    if (it.kind === 'throw') {
      if (s.t <= s.wind) {
        const u = s.t / s.wind, hx = s.sx, hy = H + 2 * K - (H + 2 * K - s.sy) * Math.min(1, u * 1.4);
        const ang = drawArm(s.ax, s.ay, hx, hy, k);
        const ux = Math.cos(ang), uy = Math.sin(ang);
        drawSprite('fist', hx + ux * 1.5 * k, hy + uy * 1.5 * k, ang + Math.PI / 2, k, s.dir < 0);
        drawSprite(it.id, hx + ux * 5 * k, hy + uy * 5 * k, 0, k);
      } else {
        const u = (s.t - s.wind) / (s.dur - s.wind), e = 1 - (1 - u) * (1 - u);
        const x = s.sx + (s.x - s.sx) * e, y = s.sy + (s.y - s.sy) * e - Math.sin(u * Math.PI) * 14 * K / 3;
        // kol geri çekilir
        const v = Math.min(1, u * 2);
        const hx = s.sx, hy = s.sy + (H + 4 * K - s.sy) * v;
        if (v < 1) { const ang = drawArm(s.ax, s.ay, hx, hy, k); drawSprite('slap', hx + Math.cos(ang) * 5 * k, hy + Math.sin(ang) * 5 * k, ang + Math.PI / 2, k, s.dir < 0); }
        drawSprite(it.id, x, y, u * 5, k * (0.7 + 0.3 * e));
      }
    } else {
      let hx, hy;
      if (s.t <= s.hitAt) { const u = s.t / s.hitAt, e = u * u; hx = s.sx + (s.x - s.sx) * e; hy = s.sy + (s.y - s.sy) * e; }
      else { const v = (s.t - s.hitAt) / (s.dur - s.hitAt), e = v * v; hx = s.x + (s.sx - s.x) * e; hy = s.y + (s.sy - s.y) * e; }
      // bilek biraz geride kalsın ki eşya hedefe değsin
      const ang0 = Math.atan2(hy - s.ay, hx - s.ax);
      hx -= Math.cos(ang0) * 6 * k; hy -= Math.sin(ang0) * 6 * k;
      const ang = drawArm(s.ax, s.ay, hx, hy, k);
      drawHeld(it, hx, hy, ang, s.dir, k);
    }
  }
}

// ---------- Parçacıklar, balon, HUD ----------
function drawParts() {
  for (const p of parts) {
    if (p.kind === 'star') {
      const x = HX + head.ox + Math.cos(p.ang) * p.r, y = HT + 3 * K + head.oy + Math.sin(p.ang) * p.r * 0.35;
      px(x - 1, y, 3, 1, C.star); px(x, y - 1, 1, 3, C.star); px(x, y, 1, 1, C.white);
    } else if (p.kind === 'feather') { px(p.x, p.y, 2, 1, C.fea); px(p.x, p.y + 1, 1, 1, C.feaD); }
    else if (p.kind === 'snow') px(p.x, p.y, 1, 1, C.snow);
    else if (p.kind === 'spark') px(p.x, p.y, 1, 1, C.gold);
    else if (p.kind === 'heart') { px(p.x, p.y, 1, 1, C.heart); px(p.x + 2, p.y, 1, 1, C.heart); px(p.x, p.y + 1, 3, 1, C.heart); px(p.x + 1, p.y + 2, 1, 1, C.heart); }
    else if (p.kind === 'z') text('Z', p.x, p.y, C.zz, 1, 'left', true);
  }
  for (const e of fx) text(e.s, e.x, e.y, e.c, e.k, 'center');
}
function drawBubble() {
  if (bubbleT <= 0 || !bubble) return;
  let k = K >= 4 ? 2 : 1;
  if (textW(bubble, k) + 6 * k > W - 4) k = 1;
  const bw = textW(bubble, k) + 6 * k, bh = 5 * k + 4 * k;
  let bx = HX + head.ox + 8 * K - bw / 2; bx = Math.max(2, Math.min(W - bw - 2, bx));
  const by = HT + head.oy - bh - 5 * k;
  px(bx - 1, by - 1, bw + 2, bh + 2, C.out); px(bx, by, bw, bh, C.white);
  const tx = Math.max(bx + 2, Math.min(bx + bw - 6, HX + head.ox + 6 * K));
  px(tx, by + bh, 3, 2, C.out); px(tx, by + bh - 1, 3, 1, C.white); px(tx + 1, by + bh + 1, 1, 1, C.white);
  text(bubble, bx + 3 * k, by + 2 * k, C.out, k, 'left', true);
}
function drawHUD() {
  const s1 = String(hits), s2 = 'X' + combo, s3 = 'X' + best;
  const pw = Math.max(textW('VURUS'), textW('REKOR')) + 10 + Math.max(textW(s1, 2), textW(s2), textW(s3)) + 8;
  const x0 = 3, y0 = 3, ph = 31;
  // panel: koyu zemin, altın kenar, bordo iç çizgi
  px(x0 - 1, y0 - 1, pw + 2, ph + 2, C.gold);
  px(x0, y0, pw, ph, C.out);
  px(x0 + 1, y0 + 1, pw - 2, 1, C.redD);
  const lx = x0 + 3, vx = x0 + pw - 4;
  // VURUŞ (büyük sayı, vuruşta hafif zıplar)
  icon('fist', lx, y0 + 4, C.gold);
  text('VURUS', lx + 7, y0 + 4, C.hudDim, 1, 'left', true);
  text(s1, vx, y0 + 2 - (hitPop > 5 ? 1 : 0), hitPop > 0 ? C.white : C.hud, 2, 'right', true);
  // KOMBO + süre çubuğu
  icon('bolt', lx, y0 + 14, comboT > 0 && combo > 1 ? C.gold : C.hudDim);
  text('KOMBO', lx + 7, y0 + 14, C.hudDim, 1, 'left', true);
  text(s2, vx, y0 + 14, comboT > 0 && combo > 1 ? C.gold : C.hud, 1, 'right', true);
  const barW = pw - 8;
  px(lx, y0 + 21, barW, 2, '#3a2a2e');
  if (comboT > 0) px(lx, y0 + 21, Math.max(1, Math.round(barW * comboT / 60)), 2, C.gold);
  // REKOR
  icon('cup', lx, y0 + 25, C.gold);
  text('REKOR', lx + 7, y0 + 25, C.hudDim, 1, 'left', true);
  text(s3, vx, y0 + 25, C.gold, 1, 'right', true);
  // barış: iki baş parmak omuzlardan yükselir
  if (thumbT > 0) {
    const u = Math.min(1, thumbT > 100 ? (120 - thumbT) / 20 : thumbT < 20 ? thumbT / 20 : 1);
    const yb = HT + HH * K + 10 * K - u * 9 * K, k = Math.max(2, K);
    drawSprite('thumb', HX + 16 * K, yb, 0, k);
    drawSprite('thumb', HX - 16 * K, yb, 0, k, true);
  }
}

// ---------- Güncelleme ----------
function update() {
  t++;
  const hd = head;
  hd.va += -0.05 * hd.a; hd.va *= 0.9; hd.a += hd.va; hd.a = Math.max(-0.8, Math.min(0.8, hd.a));
  hd.vx += -0.12 * hd.ox; hd.vx *= 0.85; hd.ox += hd.vx;
  hd.oy = 0;
  hd.sq *= 0.82; if (hd.sq < 0.005) hd.sq = 0;
  if (hd.faceT > 0) { hd.faceT--; if (hd.faceT === 0) hd.face = 'happy'; }
  if (hd.markT > 0) hd.markT--;
  if (hitPop > 0) hitPop--;
  if (hd.face === 'sleepy' && t % 20 === 0) parts.push({ kind: 'z', x: HX + hd.ox + 10 * K, y: HT - 2 * K, vx: 0.2, vy: -0.4, life: 40 });
  if (hd.face === 'laugh') hd.oy = ((t >> 2) & 1) ? -1 : 0;
  if (hd.blink > 0) hd.blink--; else if (Math.random() < 0.008) hd.blink = 6;
  const cx = HX, cy = HT + 13 * K;
  const tx = Math.max(-1, Math.min(1, (ptr.x - cx) / (K * 12))), ty = Math.max(-0.5, Math.min(0.5, (ptr.y - cy) / (K * 16)));
  hd.eyeX = (ptr.x || ptr.y) ? Math.round(tx * 2) / 2 : 0; hd.eyeY = (ptr.x || ptr.y) ? Math.round(ty * 2) / 2 : 0;

  if (bubbleT > 0) bubbleT--;
  if (comboT > 0) { comboT--; if (comboT === 0) combo = 0; }
  if (recentT > 0) { recentT--; if (recentT === 0) recent = 0; }
  if (angryT > 0) angryT--;
  if (thumbT > 0) thumbT--;

  for (let i = strikes.length - 1; i >= 0; i--) {
    const s = strikes[i]; s.t++;
    if (s.it.kind === 'throw') { if (s.t === s.wind) SFX.swish(); if (s.t >= s.dur) { impact(s); strikes.splice(i, 1); } }
    else { if (s.t === s.hitAt) impact(s); if (s.t >= s.dur) strikes.splice(i, 1); }
  }
  for (let i = fx.length - 1; i >= 0; i--) { const e = fx[i]; e.y += e.vy; e.life--; if (e.life <= 0) fx.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life--;
    if (p.kind === 'star') p.ang += p.spin;
    else { p.x += p.vx; p.y += p.vy; if (p.kind === 'feather') { p.vy += 0.01; p.vx += Math.sin(t * 0.2 + i) * 0.03; } else if (p.kind === 'snow' || p.kind === 'spark') p.vy += 0.08; }
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = splats.length - 1; i >= 0; i--) { splats[i].life--; if (splats[i].life <= 0) splats.splice(i, 1); }
}

// ---------- Döngü ----------
let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!last) last = ts;
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  g.clearRect(0, 0, W, H);
  drawScene();
  drawBody();
  drawHead();
  drawParts();
  drawStrikes();
  drawBubble();
  drawHUD();
  sc.clearRect(0, 0, cv.width, cv.height);
  sc.imageSmoothingEnabled = false;
  sc.drawImage(off, 0, 0, cv.width, cv.height);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
resize();
say('Selam! Vurma ama...', 120);
setTimeout(() => tipEl.classList.add('hide'), 8000);
requestAnimationFrame(loop);
})();
</script>
